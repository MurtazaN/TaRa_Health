[project]
name = "tara-health"
version = "0.1.0"
description = "TaRa Health — local-first, single-profile AI health & insurance assistant (Phase 1: read-only grounded Q&A)"
requires-python = ">=3.11"

# Phase 1 dependencies, grouped by the layer they serve.
dependencies = [
    # Web / API (local UI)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",   # file uploads
    "jinja2>=3.1",               # template rendering for the simple UI

    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Document parsing (local, no external API calls)
    "pymupdf>=1.24",             # native-text PDF extraction with word positions (M1)

    # Embeddings (local, on-device)
    "sentence-transformers>=3.0", # CrossEncoder runtime for the M3 reranker

    # Vector store
    "sqlite-vec>=0.1.1",         # vector search inside SQLite

    # Local LLM runtime
    "ollama>=0.3",               # client for local models (Qwen3 / Llama / Gemma) via Ollama
    "openai>=1.0",               # OpenAI-compatible client: LM Studio (local) + hosted OpenAI-style endpoints

    # Hosted generation on Google Cloud Agent Platform (formerly Vertex AI).
    # Two packages because ChatGoogleGenerativeAI (Gemini) and VertexModelGardenLlama
    # (Llama/Mistral MaaS) live in different ones; ChatVertexAI is deprecated since
    # 3.2.0 with removal at 4.0.0, so it is deliberately not used.
    "langchain-google-genai>=4.3",
    "langchain-google-vertexai>=3.2,<4",

    # PHI redaction before any span export or hosted egress
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # The spaCy model is a pinned wheel, not a `spacy download`, so the
    # container, CI, and a local venv all get the SAME model version. A
    # `download` resolves to whatever matches the installed spaCy, which would
    # leave the recall tests pinned against a moving target.
    "en_core_web_lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",

    # Execution tracing (vendor-neutral OTLP; the backend is a config swap)
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
# Encrypted-at-rest storage. SQLCipher needs a system lib; keep it optional so
# `pip install .` works out of the box during early dev.
encryption = ["pysqlcipher3>=1.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]
ocr = ["docling>=2.0"]           # layout-aware parsing + OCR; pulled in at M6

[project.scripts]
tara = "tara.web_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tara"]

[tool.hatch.metadata]
# The en_core_web_lg dependency above is a direct URL (a pinned spaCy model
# wheel, not a PyPI release) - hatchling refuses that in project.dependencies
# unless this is set. Needed so the container, CI, and a local venv can all
# resolve the exact same pinned model in one `pip install`.
allow-direct-references = true

[tool.pytest.ini_options]
# Collect only this package's tests; keeps collection deterministic.
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: end-to-end tests that touch the DB / vector store / files",
]

[tool.mypy]
files = ["src"]
# Match the dev interpreter (uv venv is 3.12); the code stays 3.11-compatible via
# `from __future__ import annotations`. Pinning 3.11 makes mypy reject 3.12-only
# syntax in third-party stubs (e.g. numpy) before it ever checks our code.
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
