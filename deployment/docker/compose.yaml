# Two services: the backend, and Phoenix as the trace viewer (Epic 0 M3).
# LM Studio deliberately stays on the HOST - it needs direct graphics-hardware
# access - and the backend reaches it via host.docker.internal.
name: tara
services:
  tara-backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
    ports:
      # Loopback-only publish. The app has no authentication and serves PHI;
      # binding all host interfaces would expose it to the local network.
      - "127.0.0.1:8000:8000"
    environment:
      TARA_LMSTUDIO_HOST: "http://host.docker.internal:1234"
      TARA_OLLAMA_HOST: "http://host.docker.internal:11434"
      TARA_GENERATION_MODE: "local"
      TARA_DATA_DIR: "/data"
      TARA_FRONTEND_DIR: "/app/frontend"
      TARA_SERVER_HOST: "0.0.0.0"
      TARA_TRACING_ENABLED: "true"
      TARA_OTLP_ENDPOINT: "http://phoenix:6006/v1/traces"
      # Agent Platform generation only. Unused in TARA_GENERATION_MODE=local.
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
    volumes:
      - tara-data:/data
      # Read-only, and never COPYd into an image layer: a credential baked into a
      # layer is permanent and shippable. ${HOME}, not ~ — Compose does not
      # reliably expand a shell tilde in a bind-mount source.
      # If this file is absent (e.g. local-mode users with no gcloud setup),
      # Docker creates an empty path at the source rather than failing; harmless
      # in generation_mode=local, since nothing reads GOOGLE_APPLICATION_CREDENTIALS there.
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcp/adc.json:ro
    extra_hosts:
      # Docker Desktop supplies this on macOS; the mapping is needed on Linux.
      - "host.docker.internal:host-gateway"
    depends_on:
      - phoenix

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      # Required, not cosmetic: unset, Phoenix writes its store to $HOME/.phoenix
      # inside the container, the phoenix-data volume below silently receives
      # nothing, traces vanish on `make down`, and PHI-derived span data sits in
      # an unmanaged writable layer instead of the volume someone would purge.
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "127.0.0.1:6006:6006"   # UI + OTLP over HTTP; loopback-only, same reasoning as the backend service
      - "127.0.0.1:4317:4317"   # OTLP over gRPC; loopback-only
    volumes:
      - phoenix-data:/mnt/data

volumes:
  tara-data:
  phoenix-data:
