name: CI

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv pip install --system -e "./backend[dev]"
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv pip install --system -e "./backend[dev]"
      - run: make typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The spaCy model (en_core_web_lg) installs as a pinned wheel dependency
      # of the backend package - see pyproject.toml - so no separate download
      # step is needed here.
      - run: uv pip install --system -e "./backend[dev]"
      # No LM Studio on a hosted runner; the suite is offline by design
      # (conftest replaces the embedder with a deterministic fake).
      - run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build
